<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FoodVis AI Dashboard</title>

    <script
        type="module"
        src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }

        #dashboard {
            width: 65%;
            height: 100vh;
            padding: 10px;
            background: white;
            border-right: 1px solid #ddd;
            box-sizing: border-box;
        }

        tableau-viz {
            width: 100%;
            height: 100%;
            border: 1px solid #dddddd;
            background: white;
        }

        #ask-ai-panel {
            width: 35%;
            height: 100vh;
            padding: 20px;
            background: #fafafa;
            overflow-y: auto;
            box-sizing: border-box;
        }

        h2, h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 16px;
        }

        textarea, select, button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            margin-bottom: 14px;
            padding: 10px;
            font-size: 14px;
        }

        select {
            height: 44px;
            background: white;
            border: 1px solid #999;
            border-radius: 4px;
        }

        textarea {
            height: 120px;
            resize: vertical;
            border: 1px solid #999;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }

        button {
            cursor: pointer;
            border: 1px solid #999;
            border-radius: 4px;
            background: #eeeeee;
            font-size: 16px;
        }

        button:hover {
            background: #dddddd;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #imagePreview {
            display: none;
            max-width: 160px;
            max-height: 120px;
            margin-top: 8px;
            border: 1px solid #dddddd;
            border-radius: 6px;
            background: white;
        }

        #removeImageButton {
            display: none;
            margin-top: 8px;
            padding: 7px;
            background: #777777;
            color: white;
            font-size: 13px;
        }

        #removeImageButton:hover {
            background: #555555;
        }

        #answer {
            background: #f2f2f2;
            padding: 12px;
            border-radius: 6px;
            white-space: pre-wrap;
            min-height: 120px;
            line-height: 1.5;
        }

        #generatedImageContainer {
            display: none;
            margin-top: 14px;
        }

        #generatedImage {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }

        .note {
            font-size: 12px;
            color: #666;
            margin-top: -6px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div id="dashboard">
        <tableau-viz
            id="tableauViz"
            src="https://public.tableau.com/views/project_17834353291910/1?:language=zh-CN&:sid=&:redirect=auth&:display_count=n&:origin=viz_share_link"
            toolbar="bottom"
            hide-tabs>
        </tableau-viz>
    </div>

    <div id="ask-ai-panel">
        <h2>Ask AI</h2>

        <label for="presetQuestion">Suggested Questions</label>
        <select id="presetQuestion">
            <option value="">Choose a suggested question...</option>
            <option value="Can you explain this bar chart?">Can you explain this bar chart?</option>
            <option value="Can you explain this treemap?">Can you explain this treemap?</option>
            <option value="Can you explain this Radar chart?">Can you explain this Radar chart?</option>
            <option value="Can you explain this scatter matrix?">Can you explain this scatter matrix?</option>
            <option value="Can you explain normalized impact in the treemap?">Can you please explain normalized impact in the treemap?</option>
            <option value="Which diet group has the highest environmental impact?">Which diet group has the highest environmental impact?</option>
            <option value="Which diet group has the lowest environmental impact?">Which diet group has the lowest environmental impact?</option>
            <option value="Can you generate a bar chart of this data?">Can you generate a bar chart of this data?</option>
            <option value="Can you generate a treemap of this data?">Can you generate a treemap of this data?</option>
            <option value="Can you generate a radar chart of this data?">Can you generate a radar chart of this data?</option>
            <option value="Can you generate a scatterplot matrix of this data?">Can you generate a scatterplot matrix of this data?</option>
        </select>
        <div class="note">Select a pre-formulated question, or type your own question below.</div>

        <label for="question">Question</label>
        <textarea id="question" placeholder="Type a question here, or paste a dashboard screenshot with Ctrl + V..."></textarea>

        <img id="imagePreview" alt="Pasted dashboard screenshot preview" />

        <button id="removeImageButton" type="button">Remove screenshot</button>
        <div class="note">You can send text only, screenshot only, or both.</div>

        <button id="askButton">Ask AI</button>

        <h3>AI Response</h3>
        <div id="answer">The AI response will appear here.</div>

        <div id="generatedImageContainer">
            <h3 id="generatedImageTitle">AI Generated Image</h3>
            <img id="generatedImage" alt="AI generated chart" />
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
